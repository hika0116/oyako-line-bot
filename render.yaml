services:
  - type: web
    name: oyako-line-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: APP_ENV
        value: production
      - key: CHANNEL_SECRET
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: MEAL_SUGGESTION_TTL_SECONDS
        value: "1800"
